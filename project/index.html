 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link rel="stylesheet" href="./Style.css">
</head>
<body>
    <div id="div1">

    <h1 id="topic">📝To Do List</h1>
    <h4 id="topic1">Organize your task and boost your productivity</h4>

    <div id="topic2">

    <input type="text" id="inputTask" placeholder="✏️Enter the Task">
    <input type="date" id="dateTask" placeholder="Enter the Date">

    <select name="" id="priority">
        <option value="🟢">Hight 🟢</option>
        <option value="🟡">Medium 🟡</option>
        <option value="🔴">Low 🔴</option>
    </select>

    <button id="addtask">Add</button>

    </div>
    <hr class="line">
    <label class="your">📋Your Tasks📝</label>

    <ul id="li"></ul> 

    </div>
    <script src="./to-do.js"></script>

</body>
</html>
